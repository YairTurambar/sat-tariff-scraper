[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sat_tariff"
version = "0.1.0"
description = "Packaged SAT tariff scraper with resumable storage and Excel export"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Placeholder Copyright Holder"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "openpyxl>=3.1,<4",
  "playwright>=1.54,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5,<6",
]

autoenv = [
  "python-dotenv>=1.0,<2",
]

visual = [
  "Pillow>=12.3,<13",
  "numpy>=1.26,<3",
  "scikit-image>=0.22,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: tests that exercise live or cross-module flows",
  "manual: tests that require manual environment setup or portal access",
  "visual: tolerant screenshot comparison; self-skips with a reason when tools/refs are missing",
]
addopts = "-m 'not integration and not manual'"
